name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  SOLANA_VERSION: "4.3.2"
  ANCHOR_VERSION: "1.2.1"

jobs:
  programs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Solana and Anchor
        id: tools
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/solana
            ~/.cache/solana
            ~/.local/bin/anchor
          key: tools-${{ runner.os }}-solana-${{ env.SOLANA_VERSION }}-anchor-${{ env.ANCHOR_VERSION }}

      - name: Install Solana CLI
        if: steps.tools.outputs.cache-hit != 'true'
        run: sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"

      - name: Install Anchor CLI
        if: steps.tools.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.local/bin
          gh release download "v${ANCHOR_VERSION}" --repo solana-foundation/anchor \
            --pattern "anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu" --output ~/.local/bin/anchor
          chmod +x ~/.local/bin/anchor

      - name: Add tools to PATH
        run: |
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format and lint
        run: ./do check

      - name: Build and test
        run: ./do test

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run typecheck
